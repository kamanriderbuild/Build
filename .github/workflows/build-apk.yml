name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - 'public/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync web assets into APK
        run: |
          rm -rf android-apk/app/src/main/assets/www
          mkdir -p android-apk/app/src/main/assets/www
          cp -R public/* android-apk/app/src/main/assets/www/

      - name: Make gradlew executable
        run: chmod +x android-apk/gradlew

      - name: Build debug APK
        working-directory: android-apk
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: chezi-inspection-apk
          path: android-apk/app/build/outputs/apk/debug/*.apk
