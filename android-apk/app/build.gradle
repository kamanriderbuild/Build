plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chezi.inspection'
    compileSdk 34

    defaultConfig {
        applicationId "com.chezi.inspection"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
